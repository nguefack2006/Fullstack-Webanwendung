services:
  backend:
    build: ./backend
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    env_file:
      - ./backend/.env

    ports:
      - "3000:3000"
    
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.PORT + '/api/ready',
          { signal: AbortSignal.timeout(3000) })
          .then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"

  database:
    image: postgres:18
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
