services:
  backend:
    build: ./backend
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    env_file:
      - ./backend/.env

    ports:
      - "8080:3000"

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"

  database:
    image: postgres:18
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
