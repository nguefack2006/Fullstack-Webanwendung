<h2>Warenausgang erfassen</h2>

<form (ngSubmit)="abbuchen()">

  <label>Produkt-ID:</label>
  <input
    type="number"
    name="produktId"
    [(ngModel)]="produktId"
    required
  >

  <label>Menge:</label>
  <input
    type="number"
    name="menge"
    [(ngModel)]="menge"
    min="1"
    required
  >

  <button type="submit">
    Warenausgang buchen
  </button>

</form>

<p>{{ meldung }}</p>
