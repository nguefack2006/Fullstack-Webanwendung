@if (benutzer(); as konto) {
    <h1>Willkommen, {{ konto.benutzerVorname }}!</h1>

    @if (konto.benutzerRolle === 'LAGERVERWALTER') {
        <app-produkt-anlegen></app-produkt-anlegen>
    }

    <app-abmelden
        (abgemeldet)="benutzer.set(null); formular.reset()"
    ></app-abmelden>
} @else {
    <h1>Anmelden</h1>

    <form [formGroup]="formular" (ngSubmit)="anmelden()">
        <div>
            <label for="email">E-Mail-Adresse</label>
            <input
                id="email"
                type="email"
                autocomplete="username"
                formControlName="benutzerEmail"
                required
            >
        </div>

        <div>
            <label for="passwort">Passwort</label>
            <input
                id="passwort"
                type="password"
                autocomplete="current-password"
                formControlName="benutzerPasswort"
                required
            >
        </div>

        <button type="submit" [disabled]="formular.invalid || laedt()">
            {{ laedt() ? 'Anmeldung läuft …' : 'Anmelden' }}
        </button>
    </form>
}

@if (fehler()) {
    <p role="alert">{{ fehler() }}</p>
}
